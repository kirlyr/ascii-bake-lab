<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tavern Wardrobe</title>
  <link rel="stylesheet" href="/src/player/player.css" />
</head>
<body>
  <main class="tavern">
    <section class="panel inventory" aria-labelledby="inv-title">
      <header class="inv-head">
        <h1 id="inv-title">┤ HERO · WARDROBE ├</h1>
        <a href="home.html">Home →</a>
      </header>
      <div class="doll">
        <div class="slot-col" id="slots-l"></div>
        <div class="stage-wrap">
          <canvas id="stage" aria-label="ASCII character. Drag sideways to turn, drop an item here to equip it."></canvas>
          <div class="turn row" id="turn" role="group" aria-label="Turn character">
            <button id="rot-l" aria-label="Turn left">⟲</button>
            <span id="yaw" class="muted">-90°</span>
            <button id="rot-r" aria-label="Turn right">⟳</button>
          </div>
        </div>
        <div class="slot-col" id="slots-r"></div>
      </div>
      <div class="bag-head">
        <h2 id="bag-title">Bag</h2>
        <div class="row" id="bag-filter" role="group" aria-label="Filter bag"></div>
      </div>
      <p class="muted hint">Click an item to inspect · double-click or Enter to equip · drag onto a slot or the hero · drag a worn item back to the bag to take it off</p>
      <ul id="bag" class="bag" aria-labelledby="bag-title"></ul>
    </section>
    <aside class="panel detail" id="detail" aria-live="polite"></aside>
    <details class="panel dev">
      <summary>Dev</summary>
      <div class="row" role="group" aria-label="Clip">
        <button data-clip="idle" aria-pressed="true">Idle</button>
        <button data-clip="walk" aria-pressed="false">Walk</button>
      </div>
      <div class="row" role="group" aria-label="Facing">
        <button data-dir="left" aria-pressed="false">← Left</button>
        <button data-dir="right" aria-pressed="true">Right →</button>
      </div>
      <div class="row" role="group" aria-label="Color mode">
        <button data-mode="material" aria-pressed="true">Material</button>
        <button data-mode="part" aria-pressed="false">Part</button>
        <button data-mode="depth" aria-pressed="false">Depth</button>
      </div>
      <label><input type="checkbox" id="sockets"> Blade socket markers</label>
      <div class="row"><button id="play" aria-pressed="true">Pause</button></div>
      <p class="muted">Hold ← / → to walk.</p>
      <p id="info" class="muted"></p>
    </details>
  </main>
  <script type="module" src="/src/player/main.ts"></script>
</body>
</html>
